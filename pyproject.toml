[project]
name = "transcribe-ui-workspace"
version = "0.0.0"
description = "Workspace root for the Transcribe-UI desktop app and the Runpod transcription worker."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
# Workspace members, installed into the shared dev environment by `uv sync`.
dependencies = ["transcribe-contracts"]

[dependency-groups]
dev = [
    # Lint tools
    "ruff>=0.16.0",
    "flake8>=7.3.0,<8",
    "mypy>=2.3.0",
    "gitlint>=0.19.1",
    # flake8 plugins (ruff does not cover all of them, see docs/ai/tooling.md)
    "wemake-python-styleguide>=1.7.0",
    "flake8-print>=5.0.0",
    "flake8-bugbear>=25.11.29",
    "flake8-assertive>=2.2.0",
    "flake8-eradicate>=1.5.0",
    "flake8-builtins>=3.1.0",
    "flake8-annotations>=3.2.0",
    "flake8-comprehensions>=3.17.0",
    "flake8-spellcheck>=0.28.0",
    "flake8-pydantic>=0.4.0",
    "pep8-naming>=0.15.1",
    # Tests
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    # GUI tests (qtbot, offscreen); added for all of M6 by M6.2.
    "pytest-qt>=4.5.0",
    "moto[s3]>=5.2.3",
    "types-boto3[s3]>=1.44.12",
    # IANA time zones for zoneinfo in tests where the OS has none (Windows); the app itself
    # only uses the OS's local zone.
    "tzdata>=2026.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
transcribe-contracts = { workspace = true }

[tool.mypy]
python_version = "3.13"
strict = true

warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# The worker's GPU stack (`engine` extra) is not installed in the dev env or CI; only
# `transcribe_worker.engine.whisperx_engine` imports it.
[[tool.mypy.overrides]]
module = ["whisperx", "whisperx.*", "torch", "torch.*", "torchaudio", "torchaudio.*", "ctranslate2", "ctranslate2.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

target-version = "py313"

line-length = 120

[tool.ruff.lint]
select = ["ALL"]

external = ["WPS"]

ignore = [
    # Avoid enforcing line-length violations (`E501`)
    "E501",
    # Avoid enforcing no-blank-line-before-class violations (`D211`)
    "D211",
    # Avoid enforcing multi-line-summary-second-line violations (`D213`)
    "D213",
    # Avoid enforcing Missing docstring in public package (`D104`) because nobody will read it.
    "D104",
    # Avoid enforcing Missing copyright notice at top of file (`CPY001`).
    "CPY001",
    # Avoid enforcing Use of assert detected (`S101`), because it can be useful for internal APIs, and we are not optimizing during deployment.
    "S101",
    # Avoid enforcing exception name should be named with an Error suffix, because we use Information and Warning level Exceptions as well.
    "N818",
    # The following rules may cause conflicts when used with the formatter: `COM812`
    "COM812",
]

# Fix isort violations (I)
# Fix flake8-type-checking violations (TC)
fixable = ["I", "TC"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Claude Code hooks talk to the harness through stdout and run git as a subprocess by design.
".claude/hooks/*.py" = ["T201", "S603", "S607"]
# Test dirs and the dev scripts dir have no __init__.py on purpose (pytest importlib mode;
# standalone scripts run with `uv run`).
"**/tests/**/*.py" = ["INP001"]
"scripts/*.py" = ["INP001", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["support", "transcribe_contracts", "transcribe_ui", "transcribe_worker"]

[tool.ruff.lint.mccabe]
# Same limit as flake8 (`max_complexity` in .flake8).
max-complexity = 8

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
# importlib mode: several workspace members have `tests/` dirs without `__init__.py`.
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib", "-m", "not integration"]
xfail_strict = true
# The desktop tests import their helpers as `support.*` (importlib mode adds no test dir to sys.path).
pythonpath = ["apps/desktop/tests"]
markers = [
    "integration: talks to real R2/Runpod; deselected by default, Runpod writes only with the architect present",
]
