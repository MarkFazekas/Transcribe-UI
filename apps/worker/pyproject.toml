[project]
name = "transcribe-worker"
version = "0.1.0"
description = "Runpod GPU worker that transcribes Transcribe-UI batches from Cloudflare R2."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.44",
    "pydantic>=2.12",
    "transcribe-contracts",
]

[project.optional-dependencies]
# GPU transcription stack; installed only in the worker image (`--extra engine`).
engine = [
    "whisperx~=3.8.6",
    # Imported or called directly by the adapter (careful mode, GPU check), so pinned here too.
    "faster-whisper~=1.2.1",
    "ctranslate2>=4.5,<5",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
]

[project.scripts]
transcribe-worker-entry = "transcribe_worker.entry.supervisor:main"
transcribe-worker-reaper = "transcribe_worker.reaper.main:main"

[tool.uv.sources]
transcribe-contracts = { workspace = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
