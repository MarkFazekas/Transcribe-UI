[project]
name = "transcribe-ui"
version = "0.1.0"
description = "Desktop app that sends local audio and video to a Runpod Whisper worker and places the subtitles."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
# Every runtime dependency of the M5 backend, added up front so parallel parts do not conflict
# on uv.lock (docs/ai/plans/m5.md §1).
dependencies = [
    "alembic>=1.20",
    "boto3>=1.44",
    "httpx>=0.29",
    "keyring>=25.7",
    "platformdirs>=4.14",
    "pydantic>=2.12",
    # QtCore, QtGui, QtWidgets, QtTest only (LGPL modules); added for all of M6 by M6.2.
    "pyside6-essentials>=6.12",
    "sqlalchemy>=2.1",
    "transcribe-contracts",
]

# Two executables (A20): the console CLI, which never imports Qt, and the windowed GUI.
[project.scripts]
transcribe-ui = "transcribe_ui.cli.main:run"

[project.gui-scripts]
transcribe-ui-gui = "transcribe_ui.gui.main:run"

# The release build's tools (docs/ai/plans/m8.md §1 "Packaging tool"): installed only into the
# build environment (`--no-dev --group packaging`), never into a bundle.
[dependency-groups]
packaging = [
    "pyinstaller>=6.22",
    # Converts the PNG icon to `.ico` / `.icns` (M8.3).
    "pillow>=13.0",
]

[tool.uv.sources]
transcribe-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
